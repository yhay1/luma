name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL || secrets.CAP_SERVER_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production URL
        run: |
          if [ -z "$CAP_SERVER_URL" ] || [[ "$CAP_SERVER_URL" == *"YOUR-VERCEL-DOMAIN"* ]]; then
            echo "CAP_SERVER_URL must be set to the deployed HTTPS Vercel URL."
            exit 1
          fi
          if [[ "$CAP_SERVER_URL" != https://* ]]; then
            echo "CAP_SERVER_URL must use HTTPS."
            exit 1
          fi

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luma-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      
      - name: Upload mapping and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luma-android-build-logs
          path: |
            android/app/build/outputs/logs/**
            android/app/build/outputs/mapping/**
          if-no-files-found: ignore
          retention-days: 7

permissions:
  contents: read
